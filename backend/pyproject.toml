[project]
name = "virtdeck-backend"
version = "0.1.0"
description = "VirtDeck backend API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "libvirt.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: requires a real libvirt daemon (use test:///default where possible)",
]
testpaths = ["tests"]
